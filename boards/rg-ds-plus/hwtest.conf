# tools/hwtest.sh: what the RG DS+ should have. NAME=value lines, read on the device beside its
# board.conf (which names the input devices, backlights, battery and charger).
HWTEST_CONNECTORS="DSI-1 DSI-2"
HWTEST_MODE=1024x768
HWTEST_KMS_DRIVER=rockchip-drm
HWTEST_GPU_DRIVER=panfrost
HWTEST_SOUND_CARDS="rk817ext speakers"
HWTEST_AMPS="2-0034 2-0035"
HWTEST_TOUCH="Goodix Capacitive TouchScreen"
HWTEST_SD_TIMING="sd uhs SDR104"
HWTEST_WIFI=wlan0
HWTEST_BLUETOOTH=hci0
HWTEST_THERMAL="cpu-thermal gpu-thermal"
HWTEST_WATCHDOG=dw_wdt
