# nibos-hw: RG DS+ audio.
#
# Two cards: "sound" (RK817 codec: headphone jack and microphone) and
# "sound-speakers" (two AW88166 amps). nibos-audio picks the default sink by the
# headphone jack.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound-speakers.*" } ]
    actions = {
      update-props = {
        node.description = "Speakers"
        # The amps take a moment to lock to the I2S clock each time a stream
        # starts, which cuts off the start of every sound. Never suspend.
        session.suspend-timeout-seconds = 0
        priority.session = 900
        priority.driver = 900
      }
    }
  }
  {
    # The amps' I2S input side is not a microphone.
    matches = [ { node.name = "~alsa_input.platform-sound-speakers.*" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-sound.HiFi*" } ]
    actions = { update-props = { node.description = "Headphones", priority.session = 800 } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.HiFi*" } ]
    actions = { update-props = { node.description = "Microphone" } }
  }
]
