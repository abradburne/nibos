# nibos-hw: the RG DS+ is a clamshell. Closing the lid sleeps (`nib lid ignore` changes that).
# The power key is nibos-input's (a tap sleeps, a hold opens the power menu): logind acts on a
# press the moment it goes down, so it couldn't tell a tap from a hold.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
# Default 30 s: after waking, a closed lid would be ignored that long.
HoldoffTimeoutSec=5s
