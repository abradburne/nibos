# nibos-hw: the stock firmware's thermal limits for the RK3568 in the RG DS+: start limiting the CPU and GPU
# clocks at 75 °C, hold them under 85 °C (mainline's rk356x.dtsi starts at 70 and steps down
# from 75). From 70 °C the CPU dropped to 1.42 GHz a few minutes into Golden Sun at 2x hi-res 3D,
# and 4.3% of frames ran late; with these, 0.6%. The 95 °C critical trip (shutdown) stays as it
# is, stricter than stock's 115 °C. Zone 0 is cpu-thermal, zone 1 gpu-thermal; the upper trip
# goes first, so the lower one is never above it.
w /sys/class/thermal/thermal_zone0/trip_point_1_temp - - - - 85000
w /sys/class/thermal/thermal_zone0/trip_point_0_temp - - - - 75000
w /sys/class/thermal/thermal_zone1/trip_point_1_temp - - - - 85000
w /sys/class/thermal/thermal_zone1/trip_point_0_temp - - - - 75000
