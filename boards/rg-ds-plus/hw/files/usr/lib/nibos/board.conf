# nibos-hw: the Anbernic RG DS+, for the hardware layer's daemons and units
# (hw/README.md). NAME=value lines: read by nibos-input and nibos-audio
# (hw/daemons/src/board.rs), and by systemd units and shell scripts as an
# environment file.
NIBOS_BOARD=rg-ds-plus
NIBOS_BOARD_NAME="Anbernic RG DS+"

# Controls: the buttons and the stick, merged into one gamepad by nibos-input.
NIBOS_PAD_NAME="Anbernic RG DS+ Gamepad"
NIBOS_BUTTONS_DEVICE=gpio-keys-control
NIBOS_STICK_DEVICE=adc-joystick
NIBOS_VOLUME_DEVICE=gpio-keys-volume

# Sound: the RK817 codec drives the headphone jack, two AW88166 amps on I2S3
# the speakers; two cards, told apart by their sinks' node names. The amps take
# a few hundred milliseconds to lock to the I2S clock whenever it starts, so
# nibos-audio keeps a silent stream playing to them.
NIBOS_JACK_DEVICE="rk817_ext Headphones"
NIBOS_HEADPHONES_SINK=alsa_output.platform-sound.
NIBOS_SPEAKERS_SINK=alsa_output.platform-sound-speakers.
NIBOS_SPEAKERS_KEEPALIVE=1

# The RTL8821CS's drivers, loaded by nibos-network-modules.service (and kept
# from udev by modprobe.d/nibos-network.conf).
NIBOS_NETWORK_MODULES="rtw88_8821cs hci_uart"

# Devices unbound from their drivers around sleep, in this order, and bound
# again in the reverse order after waking (system-sleep/nibos-unbind): the USB
# host controller (OHCI fd840000.usb, with its EHCI companion fd800000.usb)
# hangs the kernel when it is suspended, even with nothing plugged in.
NIBOS_SLEEP_UNBIND="ohci-platform/fd840000.usb ehci-platform/fd800000.usb"

# The two panels' backlights (PWM, one per panel), by the screen they light:
# backlight0 on pwm1 is the bottom (touch) panel's, backlight1 on pwm2 the
# top's (the device tree's panel nodes; the stock-OS probe agreed). nibos-hw
# links them as /run/nibos/backlight/<screen>, lets the video group set them,
# and keeps each one's level across restarts (hw/README.md, "Brightness").
NIBOS_BACKLIGHTS="top:backlight1 bottom:backlight0"
# The lowest level nibOS sets or restores, as a share of the maximum in
# percent, so a screen can't be left dark by accident.
NIBOS_BACKLIGHT_MIN_PERCENT=2

# The power key (the RK817's PWRON, as its pwrkey device), which nibos-input handles: a tap
# sleeps, a hold of NIBOS_POWER_LONG_PRESS_MS asks the boot UI for its power menu. Kept well
# under the PMIC's own long press, which cuts the power in hardware.
NIBOS_POWER_DEVICE="rk805 pwrkey"
NIBOS_POWER_LONG_PRESS_MS=1000

# The lid's switch (SW_LID), which logind acts on and nibos-charge-boot watches.
NIBOS_LID_DEVICE=gpio-keys-hall

# What switched the device on, as the RK817 records it (ON_SOURCE, 0xF5, on i2c-0 at 0x20):
# 0x40 the charger plugged in, 0x80 the power key. Plugging a charger into a switched-off
# RG DS+ switches it on; nibos-charge-boot then charges asleep instead of starting the boot UI
# (hw/README.md, "Charging while off"). Bus, address, register, charger bit, power key bit.
NIBOS_POWER_ON_SOURCE="0 0x20 0xf5 0x40 0x80"

# The Falcon partition's first sector (BOARD_FALCON_SECTOR): the A/B slots' FITs and their boot
# control block live in it (nibos-bootctl, docs/design/ab-rollback.md).
NIBOS_FALCON_SECTOR=163840

# The battery and charger (the RK817's), as power supplies: nibos-hw links them as
# /run/nibos/battery and /run/nibos/charger and lets the wheel group set battery protect
# (`nib battery protect on|off`): the charge voltage lowered to NIBOS_BATTERY_PROTECT_UV, at
# which the cell stops at about 80-85% (the rk817 patch's writable constant_charge_voltage).
# The battery stays connected, as at a full charge. Charging itself is the stock firmware's:
# 1.5 A from USB, 2 A into the cell at most, to 4.35 V (the device tree).
NIBOS_BATTERY=rk817-battery
NIBOS_CHARGER=rk817-charger
NIBOS_BATTERY_PROTECT_UV=4100000
