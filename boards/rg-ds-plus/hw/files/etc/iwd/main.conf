# nibos-hw: iwd's settings for the RG DS+'s RTL8821CS (the root image has no other).
[General]
EnableNetworkConfiguration=true
# Keep the kernel's wlan0. iwd otherwise makes its own interface named after the
# phy index, which grows each time the driver reloads.
UseDefaultInterface=true

[Network]
NameResolvingService=systemd

# rtw88_8821cs drops off the network with power save on. iwd re-applies its own
# power save setting on every connect, so this is the only setting that sticks.
[DriverQuirks]
PowerSaveDisable=*
