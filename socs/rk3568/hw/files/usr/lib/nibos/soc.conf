# nibos-hw: the Rockchip RK3568, for the hardware layer's units (hw/README.md).
# NAME=value lines, read as an environment file.
NIBOS_SOC=rk3568

# Video decode/encode (Hantro) and 2D blit (RGA): nothing needs them while the
# system starts, and loading them with the v4l2 stack is a large part of udev's
# start-up scan. Blacklisted in modprobe.d/nibos-late.conf; loaded once booted
# by nibos-late-modules.service.
NIBOS_LATE_MODULES="hantro_vpu rockchip_rga"
