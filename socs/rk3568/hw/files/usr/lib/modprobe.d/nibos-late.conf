# nibos-hw: the RK3568's video decode/encode and 2D blit drivers stay out of
# start-up (NIBOS_LATE_MODULES in soc.conf): nothing needs them while the system
# starts, and loading them (with the v4l2 stack) is a large part of udev's
# start-up scan. nibos-late-modules.service loads them once booted.
blacklist hantro_vpu
blacklist rockchip_rga
