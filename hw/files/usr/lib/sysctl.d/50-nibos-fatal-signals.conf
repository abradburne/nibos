# nibos-hw: name the process and signal in the kernel log when a program dies of a fatal signal
# it did not handle. Most of all for the kernel's own silent kills, which otherwise leave only
# "exited with signal: 9" in DSlot's log: the RT watchdog ("RT Watchdog Timeout (hard)") when a
# real-time thread runs past RLIMIT_RTTIME without sleeping. The lines go into bug reports.
kernel.print-fatal-signals = 1
