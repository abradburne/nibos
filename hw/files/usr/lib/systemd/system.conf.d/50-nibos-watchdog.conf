# nibos-hw: systemd feeds the SoC's hardware watchdog (dw_wdt on the RK3568). If the system
# hangs so hard that PID 1 stops running, the watchdog's first stage (RuntimeWatchdogPreSec:
# its pre-timeout, about RuntimeWatchdogSec after the last ping) panics the kernel, and the
# panic restarts the device through the board's restart handler (the RK817 PMIC on the RG DS+;
# the watchdog's own reset, its second stage, never brings that board back). A shutdown that
# hangs is restarted after RebootWatchdogSec. The watchdog's driver stops it in suspend and
# starts it again on waking. The kernel's default pre-timeout governor is panic (nibos.config).
[Manager]
RuntimeWatchdogSec=20s
RuntimeWatchdogPreSec=10s
RebootWatchdogSec=2min
