# nibos-hw: systemd feeds the SoC's hardware watchdog (dw_wdt on the RK3568). If the system
# hangs so hard that PID 1 stops running, the watchdog resets the device after RuntimeWatchdogSec
# (systemd keeps it under what the hardware allows). A shutdown that hangs is reset after
# RebootWatchdogSec. The watchdog's driver stops it in suspend and starts it again on waking.
[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=2min
