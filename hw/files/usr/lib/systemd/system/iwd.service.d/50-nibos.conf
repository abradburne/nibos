# nibos-hw: iwd is part of nibos-network.target and needs its drivers loaded.
# Ordered after systemd-resolved so iwd stops before resolved at power-off (avoiding a D-Bus
# DNS cleanup error and 1 s stall during shutdown).
[Unit]
PartOf=nibos-network.target
Requires=nibos-network-modules.service
After=nibos-network-modules.service systemd-resolved.service
