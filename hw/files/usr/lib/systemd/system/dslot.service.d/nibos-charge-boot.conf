# nibos-hw: don't start the boot UI when the charger switched the device on: it charges asleep
# (nibos-charge-boot.service), and starts the boot UI if the power key or the lid wakes it.
# nibos-splash checks the PMIC power-on source at ~0.63 s and writes /run/nibos/charge-boot
# only on charger power-ons; nibos-charge-boot.service removes it when woken to resume boot.
[Unit]
ConditionPathExists=!/run/nibos/charge-boot
