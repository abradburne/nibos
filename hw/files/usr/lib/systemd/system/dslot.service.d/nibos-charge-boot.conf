# nibos-hw: don't start the boot UI when the charger switched the device on: it charges asleep
# (nibos-charge-boot.service), and starts the boot UI if the power key or the lid wakes it.
# nibos-charge-boot --check short-circuits immediately when /run/nibos/splash exists.
[Service]
ExecCondition=/usr/bin/nibos-charge-boot --check
