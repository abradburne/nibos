# nibos-hw: DSlot, and the game running in it, stop before the cards are unmounted at power-off
# and restart (units stop in the reverse of their After= order). Without it systemd unmounted
# /mnt/roms while the game was still writing its resume state there: "Failed unmounting
# /mnt/roms" (target busy). Ordering only: the cards still mount when first used.
[Unit]
After=mnt-roms.mount mnt-ds.mount
