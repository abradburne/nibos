# nibos-hw: nibos-sleep-off queues poweroff.target from its post hook inside
# systemd-suspend.service. systemd-suspend.service has DefaultDependencies=no
# and no ordering against shutdown.target, so without Before=shutdown.target
# power-off starts in parallel with the other post hooks (including USB
# re-bind in nibos-unbind) and before systemd-sleep thaws user.slice.
[Unit]
Before=shutdown.target
