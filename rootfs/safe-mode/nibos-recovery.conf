# nibOS (rootfs/safe-mode): when the boot UI fails, systemd starts it again; when it fails
# StartLimitBurst times within StartLimitIntervalSec, the safe mode (nibos-safe-mode.service)
# comes up instead of the console's login prompt: what failed, and a menu to restart DSlot,
# restart the device, open a console or power off. A clean exit still gives the console
# (dslot.service's OnSuccess=), and so does a boot that skips DSlot (a charge-sleep).
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=3
# The package's OnFailure=getty@tty1.service, replaced.
OnFailure=
OnFailure=nibos-safe-mode.service

[Service]
Restart=on-failure
RestartSec=1
# Each failure's logs on the card at once (nibos-bootlog-now.service), as root.
ExecStopPost=+/bin/sh -c '[ "$$SERVICE_RESULT" = success ] || systemctl --no-block start nibos-bootlog-now.service'
