[package]
name = "nibos-splash"
version = "0.1.0"
edition = "2021"
description = "init= on nibOS: the boot picture on the screens, then systemd; and the goodbye at power-off."
license = "GPL-3.0-or-later"

[dependencies]
libc = "0.2"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
# nibos-pspl only (the build-time picture tool); not linked into nibos-splash.
png = "0.17"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"
