# nibos (a downloadable image): iwd's networks are on the state partition (/var/lib/iwd links
# there), which provision.toml writes.
[Unit]
RequiresMountsFor=/var/lib/nibos/state

[Service]
# Not iwd's StateDirectory=iwd: systemd won't set up a state directory that is a symlink
# (status 238, "Too many levels of symbolic links") and iwd never starts. iwd follows the
# link itself; ProtectSystem=strict needs its target made writable instead.
StateDirectory=
ReadWritePaths=/var/lib/nibos/state/iwd
