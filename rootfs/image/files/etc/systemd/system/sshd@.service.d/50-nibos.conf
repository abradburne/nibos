# nibos (a downloadable image): the keys are the ones provision.toml gave, on the state
# partition (sshd_config.d/50-nibos.conf). Arch's per-connection unit, which sshd.socket starts,
# names its own AuthorizedKeysFile on the command line (systemd's credentials, then
# ~/.ssh/authorized_keys), which beats the config file: every provisioned key was refused.
[Service]
ExecStart=
ExecStart=-/usr/bin/sshd -i
