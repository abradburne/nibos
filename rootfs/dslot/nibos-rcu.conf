# nibos: expedited RCU grace periods (installed as /etc/tmpfiles.d/nibos-rcu.conf by install.sh).
# Closing an input device waits for an RCU grace period (evdev_detach_client), and SDL opens and
# closes every one of them while it looks for controllers: ~0.3 s of a game's start
# and of DSlot's return to the shelf, ~0.1 s expedited.
w /sys/kernel/rcu_expedited - - - - 1
