# nibos (rootfs/dslot): the user the dslot package's unit runs DSlot as, and where that user's
# PipeWire is (DSlot's clicks go through pacat, and outside a login session nothing else says
# where its socket is; the user lingers, so its user manager runs from boot). Installed as
# /etc/systemd/system/dslot.service.d/user.conf by install.sh, which fills in the placeholders
# from config.sh. Without it the unit would run DSlot as root, which DSlot refuses.
[Service]
User=@NIBOS_USER@
Group=@NIBOS_USER@
Environment=XDG_RUNTIME_DIR=/run/user/@NIBOS_UID@
