# nibOS: `make check` on every push and pull request. Everything it runs is also run locally
# by `make check` (tools/check.sh), which is the reference.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3 libsdl2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # tools/check.sh runs the Rust checks directly on Linux (in the build machine on a Mac).
      - name: make check
        run: make check
