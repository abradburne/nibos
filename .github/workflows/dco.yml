# nibOS: every commit a pull request adds carries a Signed-off-by line (the Developer
# Certificate of Origin, CONTRIBUTING.md "Commits"). Only the pull request's own commits are
# checked.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
              if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: .* <.*@.*>$'; then
                  echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by (git commit -s; see CONTRIBUTING.md)"
                  missing=1
              fi
          done
          exit $missing
